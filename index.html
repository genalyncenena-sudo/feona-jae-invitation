
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feona Jae | 7th Birthday Royal Invitation</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f9e3ff;
  font-family: Georgia, serif;
  text-align: center;
  color: #71317e;
}

.invitation {
  width: 100%;
  max-width: 1200px;
  margin: auto;
  position: relative;
}

.poster {
  width: 100%;
  aspect-ratio: 3 / 2;
  position: relative;
  background-image: url("princess-background.jpg");
  background-position: center;
  background-size: 100% 100%;
  background-repeat: no-repeat;
}

.hotspot {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
  margin: 0;
  padding: 0;
  border-radius: 30px;
  box-shadow: none;
}

.hotspot:focus-visible {
  outline: 3px solid white;
  background: #ffffff33;
}

/* Background music controls */
.music-area {
  top: 2%;
  left: 1%;
  width: 34%;
  height: 10%;
}

/* Invitation voice button */
.voice-area {
  top: 2%;
  right: 1%;
  width: 19%;
  height: 10%;
}

/* RSVP button */
.rsvp-area {
  bottom: 2%;
  left: 14%;
  width: 19%;
  height: 10%;
}

/* Find the Royal Castle button */
.location-area {
  bottom: 2%;
  right: 13%;
  width: 20%;
  height: 10%;
}

.reminder-section {
  padding: 25px 15px 40px;
}

.reminder-button {
  display: inline-block;
  padding: 16px 30px;
  border-radius: 40px;
  color: white;
  background: linear-gradient(135deg, #ed65bd, #9252d7);
  text-decoration: none;
  font-family: Georgia, serif;
  font-size: clamp(17px, 3vw, 23px);
  font-weight: bold;
  box-shadow: 0 6px 18px #9a55bb55;
  border: 3px solid white;
  transition: .3s;
}

.reminder-button:hover {
  transform: scale(1.05);
}

.reminder-subtitle {
  font-family: Georgia, serif;
  font-style: italic;
  color: #9d51a8;
  margin-bottom: 18px;
}

footer {
  padding: 20px;
  color: #95549d;
  background: #f5d9f2;
}

@media (max-width: 600px) {
  .reminder-section {
    padding: 18px 10px 30px;
  }

  .reminder-button {
    padding: 13px 22px;
  }
}
</style>
</head>

<body>

<main class="invitation">

  <div class="poster" aria-label="Feona Jae's princess birthday invitation">

    <button class="hotspot music-area"
      onclick="toggleMusic()"
      aria-label="Play or pause background music"
      title="Background Music">
    </button>

    <button class="hotspot voice-area"
      onclick="inviteVoice()"
      aria-label="Play invitation voice"
      title="Play Invitation Voice">
    </button>

    <button class="hotspot rsvp-area"
      onclick="rsvp()"
      aria-label="RSVP"
      title="RSVP">
    </button>

    <button class="hotspot location-area"
      onclick="openMap()"
      aria-label="Find the Royal Castle"
      title="Find the Royal Castle">
    </button>

  </div>

  <section class="reminder-section">
    <p class="reminder-subtitle">
      ✨ A little reminder for our royal guests ✨
    </p>

    <a href="reminder.html" class="reminder-button">
      👑 A Magical Reminder! 💗
    </a>
  </section>

</main>

<footer>
  ✨ Thank you for being part of Feona Jae's magical story! ✨
  <br>🦋 🌸 👑 🌸 🦋
</footer>

<script>

// ===================================
// PRINCESS INVITATION VOICE OVER
// ===================================

function inviteVoice() {

  if (!window.speechSynthesis) {
    alert("Your browser does not support voice playback.");
    return;
  }

  speechSynthesis.cancel();

  const message =
    "Hello, my dear friends! " +
    "It's me, Feona! " +
    "I'm turning seven years old! " +
    "And I would love to invite you to my magical princess birthday party! " +
    "Let's celebrate together on November sixteenth, twenty twenty-six, " +
    "at two o'clock in the afternoon, " +
    "at The Courtyard Resort in Morong, Rizal! " +
    "Please don't forget to bring your swimming attire! " +
    "You can also enjoy swimming with us after the birthday program! " +
    "I can't wait to see you! " +
    "See you there! Bye bye!";

  const voice = new SpeechSynthesisUtterance(message);

  voice.lang = "en-US";
  voice.rate = 0.88;
  voice.pitch = 1.65;
  voice.volume = 1;

  const voices = speechSynthesis.getVoices();

  const selectedVoice = voices.find(v =>
    /samantha|jenny|aria|zira/i.test(v.name) &&
    v.lang.startsWith("en")
  ) || voices.find(v =>
    v.lang.startsWith("en")
  );

  if (selectedVoice) {
    voice.voice = selectedVoice;
  }

  speechSynthesis.speak(voice);
}

// ===================================
// BACKGROUND PRINCESS MUSIC
// Original synthesized melody
// ===================================

let audioContext = null;
let musicTimer = null;
let noteIndex = 0;

const melody = [
  523.25, 659.25, 783.99, 1046.50,
  783.99, 659.25, 587.33, 698.46,
  880.00, 783.99, 659.25, 523.25,
  587.33, 698.46, 783.99, 659.25
];

function playNote() {

  if (!audioContext) return;

  const now = audioContext.currentTime;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.value =
    melody[noteIndex % melody.length];

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.035, now + 0.12);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(now);
  oscillator.stop(now + 0.9);

  noteIndex++;
}

async function startMusic() {

  if (musicTimer) return;

  try {

    if (!audioContext) {
      audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }

    await audioContext.resume();

    playNote();

    musicTimer = setInterval(playNote, 850);

  } catch (error) {
    console.log("Music could not start:", error);
  }
}

async function toggleMusic() {

  if (musicTimer) {

    clearInterval(musicTimer);
    musicTimer = null;

    if (audioContext) {
      await audioContext.suspend();
    }

  } else {

    await startMusic();

  }
}

// Try autoplay when the page opens.
// Browsers may require the visitor to interact first.

window.addEventListener("load", () => {
  startMusic();
});

// Start music on the first visitor interaction if autoplay was blocked.

document.addEventListener("pointerdown", () => {
  if (!musicTimer) startMusic();
}, { once: true });


// ===================================
// RSVP
// ===================================

function rsvp() {

  const guest = prompt(
    "May we know your name, dear guest? 💗"
  );

  if (!guest || !guest.trim()) return;

  const attending = confirm(
    "Will you be joining Feona's magical birthday celebration?"
  );

  const message =
    "Hello! I'm " + guest.trim() + ". " +
    (attending ? "I will attend" : "I cannot attend") +
    " Feona Jae's 7th birthday on November 16, 2026 at 2 PM.";

  window.open(
    "https://wa.me/?text=" + encodeURIComponent(message),
    "_blank"
  );
}


// ===================================
// FIND THE ROYAL CASTLE
// ===================================

function openMap() {

  window.open(
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent("The Courtyard Resort, Morong, Rizal"),
    "_blank"
  );

}

</script>

</body>
</html>
