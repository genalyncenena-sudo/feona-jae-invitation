<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b9a1ff"/><stop offset=".48" stop-color="#f7c6f2"/><stop offset="1" stop-color="#ffe8d9"/></linearGradient>
 <linearGradient id="castle" x2="0" y2="1"><stop stop-color="#fff6ff"/><stop offset="1" stop-color="#bd83e8"/></linearGradient>
 <linearGradient id="turret" x2="0" y2="1"><stop stop-color="#a84ee0"/><stop offset="1" stop-color="#6334a5"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<circle cx="800" cy="330" r="390" fill="url(#glow)"/>
<g fill="#fff" opacity=".45" filter="url(#blur)"><ellipse cx="300" cy="220" rx="230" ry="75"/><ellipse cx="1280" cy="260" rx="250" ry="90"/><ellipse cx="800" cy="120" rx="300" ry="70"/></g>
